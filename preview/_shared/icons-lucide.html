<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:#050b14;}
  .tag{font-size:10px;color:#99a1aa;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:20px;max-width:900px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:#585c62;}
  .cell svg{width:24px;height:24px;stroke:#8ebb1d;stroke-width:1.75;}
  h2{font-size:14px;font-weight:500;margin:24px 0 12px;}
</style>
</head>
<body>
<p class="tag">shared · lucide samples</p>
<h2>Capability cards</h2>
<div class="grid">
  <div class="cell"><i data-lucide="database"></i><span>database</span></div>
  <div class="cell"><i data-lucide="network"></i><span>network</span></div>
  <div class="cell"><i data-lucide="workflow"></i><span>workflow</span></div>
  <div class="cell"><i data-lucide="radio"></i><span>radio</span></div>
  <div class="cell"><i data-lucide="layers"></i><span>layers</span></div>
  <div class="cell"><i data-lucide="shield-check"></i><span>shield-check</span></div>
</div>
<h2>UI chrome</h2>
<div class="grid">
  <div class="cell"><i data-lucide="search"></i><span>search</span></div>
  <div class="cell"><i data-lucide="arrow-right"></i><span>arrow-right</span></div>
  <div class="cell"><i data-lucide="external-link"></i><span>external-link</span></div>
  <div class="cell"><i data-lucide="check-circle"></i><span>check-circle</span></div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>lucide.createIcons());</script>
</body>
</html>
