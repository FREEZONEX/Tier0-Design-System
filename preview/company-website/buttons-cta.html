<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/website.css">
<style>
  html,body{margin:0;padding:24px;background:var(--page);font-family:var(--font-body);}
  .tag{font-size:10px;color:var(--text-4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  button{border:0;cursor:pointer;font-family:var(--font-body);font-weight:500;font-size:15px;padding:10px 18px;border-radius:4px;}
  .primary{background:var(--green-brand);color:var(--text);}
  .primary:hover{background:var(--green-brand-2);color:#fff;}
  .secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .secondary:hover{background:var(--green-soft);}
  .ghost{background:transparent;color:var(--text-3);}
</style>
</head>
<body>
<p class="tag">company-website · CTA</p>
<div class="row">
  <button type="button" class="primary">Read the docs</button>
  <button type="button" class="secondary">View on GitHub</button>
  <button type="button" class="ghost">Contact sales</button>
</div>
</body>
</html>
