<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/product.css">
<style>
  html,body{margin:0;background:var(--tier0-bg-secondary);font-family:var(--font-sans);}
  .tag{padding:8px 16px 0;font-size:10px;color:var(--tier0-text-tertiary);text-transform:uppercase;letter-spacing:.04em;}
  .shell{max-width:720px;margin:0 0 0;background:#fff;border:1px solid var(--tier0-border);}
  .header{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--tier0-border);}
  .header h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-0.24px;}
  .header p{margin:4px 0 0;font-size:13px;color:var(--tier0-text-secondary);}
  .actions{display:flex;gap:8px;}
  .btn{border:0;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--tier0-button-primary);color:#fff;}
  .btn-s{background:transparent;border:1px solid var(--tier0-border);color:var(--tier0-text-color);}
  .controls{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--tier0-border);background:var(--tier0-bg-secondary);}
  .search{flex:1;max-width:240px;padding:8px 12px;border:1px solid var(--tier0-border);border-radius:4px;font-size:13px;}
  .content{padding:20px;min-height:80px;font-size:13px;color:var(--tier0-text-tertiary);}
</style>
</head>
<body>
<p class="tag">tier0-product · workspace</p>
<div class="shell">
  <header class="header">
    <div>
      <h1>Namespace</h1>
      <p>Topic hierarchy and live payloads</p>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-s">Export</button>
      <button type="button" class="btn btn-p">Add topic</button>
    </div>
  </header>
  <div class="controls">
    <input class="search" type="search" placeholder="Search topics…" aria-label="Search">
    <button type="button" class="btn btn-s">Filter</button>
  </div>
  <main class="content">Content area (table / tree / detail)</main>
</div>
</body>
</html>
