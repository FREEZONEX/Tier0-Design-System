<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/deck.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .slide{width:960px;height:540px;background:var(--ppt-bg1);padding:48px 56px;position:relative;font-family:var(--font-body-latin);}
  .tag{position:absolute;top:12px;right:16px;font:500 10px/1 var(--font-footer);color:var(--text-4,#99a1aa);letter-spacing:.06em;text-transform:uppercase;}
  .eyebrow{font-size:20px;font-weight:500;color:var(--ppt-emphasis-on-light);letter-spacing:-0.02em;margin-bottom:12px;}
  h1 .accent{color:var(--ppt-emphasis-on-light);}
  h1{margin:0;font-size:var(--fs-slide-page-title);font-weight:500;line-height:1.15;color:var(--ppt-tx1);letter-spacing:-0.02em;max-width:640px;}
  .body{margin:24px 0 0;font-size:var(--fs-slide-body);line-height:1.2;color:var(--ppt-tx1);max-width:520px;}
  .body li{margin:8px 0;}
  .copy{position:absolute;bottom:16px;left:56px;font-family:var(--font-footer);font-size:10px;color:#99a1aa;margin:0;}
</style>
</head>
<body>
<div class="slide">
  <span class="tag">marketing-deck · type C · Plex title</span>
  <p class="eyebrow">02 · Capabilities</p>
  <h1>Source Flow → <span class="accent">Namespace</span> → Event Flow</h1>
  <ul class="body">
    <li>Connect shop-floor sources at the edge</li>
    <li>Publish a semantic MQTT topic tree</li>
    <li>Orchestrate flows on the namespace</li>
  </ul>
  <p class="copy">Copyright © 2026 Tier0. All rights reserved.</p>
</div>
</body>
</html>
