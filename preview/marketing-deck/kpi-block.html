<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/deck.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:32px;background:var(--ppt-bg1);font-family:var(--font-body-latin);}
  .tag{font-size:10px;color:#99a1aa;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px;}
  .grid{display:flex;gap:20px;flex-wrap:wrap;}
  .kpi{flex:1;min-width:140px;max-width:200px;padding:20px;border:1px solid #e2e6de;border-radius:4px;background:#fff;}
  .num{font-size:48px;font-weight:500;line-height:1;color:var(--ppt-emphasis-on-light);letter-spacing:-0.03em;}
  .lbl{margin-top:8px;font-size:14px;color:var(--ppt-tx1);}
</style>
</head>
<body>
<p class="tag">marketing-deck · kpi</p>
<div class="grid">
  <article class="kpi"><p class="num">1.2k</p><p class="lbl">Messages / sec</p></article>
  <article class="kpi"><p class="num">4 wk</p><p class="lbl">Typical PoC</p></article>
  <article class="kpi"><p class="num">OSS</p><p class="lbl">Open source core</p></article>
</div>
</body>
</html>
