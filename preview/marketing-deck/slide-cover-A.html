<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/deck.css">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .slide{width:960px;height:540px;background:var(--ppt-tx1);position:relative;overflow:hidden;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:14px 14px;}
  .tag{position:absolute;top:12px;right:16px;font:500 10px/1 var(--font-footer);color:rgba(255,255,255,.35);letter-spacing:.06em;text-transform:uppercase;}
  .content{padding:72px 64px 80px;max-width:520px;}
  h1{margin:0;font-family:var(--font-cover);font-size:56px;font-weight:600;line-height:1;color:#fff;letter-spacing:-0.03em;}
  h1 .accent{color:var(--ppt-emphasis-on-dark);}
  .sub{margin:16px 0 0;font-family:var(--font-body-latin);font-size:20px;color:rgba(255,255,255,.75);}
  .logo{position:absolute;left:56px;bottom:40px;height:22px;}
  .copy{position:absolute;left:56px;bottom:16px;font-family:var(--font-footer);font-size:10px;color:#99a1aa;margin:0;}
  .line{position:absolute;right:80px;top:120px;width:120px;height:2px;background:var(--ppt-emphasis-on-dark);transform:rotate(-35deg);opacity:.9;}
</style>
</head>
<body>
<div class="slide">
  <span class="tag">marketing-deck · type A</span>
  <div class="content">
    <h1>Tier<span class="accent">0</span></h1>
    <p class="sub">Unified Namespace for industrial data</p>
  </div>
  <img class="logo" src="../../assets/tier0-logo-lime.svg" alt="Tier0">
  <p class="copy">Copyright © 2026 Tier0. All rights reserved.</p>
  <div class="line" aria-hidden="true"></div>
</div>
</body>
</html>
