<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;}
  .dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1px solid rgba(5,11,20,.08);}
  .lab{font-family:var(--font-mono);font-size:12px;color:#050B14;}
  .hex{font-family:var(--font-mono);font-size:12px;color:#585C62;margin-left:auto;}
  .darkrow{background:#050B14;color:#fff;}.darkrow .lab{color:#fff}.darkrow .hex{color:#CDCED0}
</style></head><body>
<div class="wrap">
  <div class="row" style="background:#fff;border:1px solid #CCC"><span class="dot" style="background:#050B14"></span><span class="lab">text / primary</span><span class="hex">#050B14</span></div>
  <div class="row darkrow"><span class="dot" style="background:#fff"></span><span class="lab">text on dark</span><span class="hex">#FFFFFF</span></div>
  <div class="row" style="background:#fff;border:1px solid #CCC"><span class="dot" style="background:#585C62"></span><span class="lab">body secondary</span><span class="hex">#585C62</span></div>
  <div class="row darkrow"><span class="dot" style="background:#B2ED1D"></span><span class="lab">accent on dark</span><span class="hex">#B2ED1D</span></div>
  <div class="row" style="background:#fff;border:1px solid #CCC"><span class="dot" style="background:#73B200"></span><span class="lab">link / emphasis</span><span class="hex">#73B200</span></div>
  <div class="row" style="background:#F0FBD2"><span class="dot" style="background:#CCF368"></span><span class="lab">row hover</span><span class="hex">#F0FBD2</span></div>
</div>
</body></html>
