<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#050B14;font-family:var(--font-sans);color:#fff;}
  .wrap{padding:24px;}
  .grid{display:flex;align-items:center;gap:24px;}
  .node{width:120px;padding:12px;border:1px solid rgba(255,255,255,.15);border-radius:8px;text-align:center;background:#0a1422}
  .node .t{font-family:var(--font-mono);font-size:12px;color:#B2ED1D;letter-spacing:-0.2px;}
  .node .s{font-size:11px;color:#CDCED0;margin-top:4px}
  svg{flex-shrink:0;}
  .flow{stroke:#B2ED1D;stroke-width:1.5;stroke-dasharray:4 4;fill:none;}
  @keyframes march{to{stroke-dashoffset:-16}}
  .flow{animation:march 1.2s linear infinite}
</style></head><body>
<div class="wrap">
  <div class="grid">
    <div class="node"><div class="t">Source</div><div class="s">Node-RED</div></div>
    <svg width="40" height="30"><path class="flow" d="M2 15 L38 15"/></svg>
    <div class="node"><div class="t">Broker</div><div class="s">MQTT</div></div>
    <svg width="40" height="30"><path class="flow" d="M2 15 L38 15"/></svg>
    <div class="node"><div class="t">Sink</div><div class="s">Timescale</div></div>
  </div>
</div>
</body></html>
