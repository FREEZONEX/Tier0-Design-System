<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#F5F5F5;font-family:var(--font-sans);color:#050B14;}
  .wrap{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:#fff;border:1px solid #CCC;border-radius:10px;padding:20px;box-shadow:1px 2px 8px 0 rgba(5,11,20,.10);}
  .label{display:inline-block;background:#F0FBD2;color:#73B200;padding:4px 14px;font-size:14px;letter-spacing:-0.14px;border-radius:2px;margin-bottom:10px;}
  .t{font-size:18px;font-weight:500;letter-spacing:-0.18px;}
  .d{font-size:13px;color:#585C62;margin-top:6px;letter-spacing:-0.2px;}
  .k{font-family:var(--font-mono);font-size:11px;color:#ACAEB1;margin-top:12px;}
</style></head><body>
<div class="wrap">
  <div class="card">
    <span class="label">Broker</span>
    <div class="t">Semantic MQTT</div>
    <div class="d">Models data using topic hierarchies and structured JSON payloads.</div>
    <div class="k">1,284 MSG/S</div>
  </div>
  <div class="card">
    <span class="label">Sink</span>
    <div class="t">TimescaleDB</div>
    <div class="d">Time-series namespace values, compressed and queryable.</div>
    <div class="k">12.4 GB · 7D RETENTION</div>
  </div>
</div>
</body></html>
