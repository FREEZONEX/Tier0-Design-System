<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#F5F5F5;font-family:var(--font-sans);color:#050B14;}
  .wrap{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .c{background:#fff;border:1px solid #CCC;border-radius:10px;padding:18px;height:60px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:#585C62;}
  .card{box-shadow:1px 2px 8px 0 rgba(5,11,20,.10);}
  .hover{box-shadow:2px 4px 16px 0 rgba(5,11,20,.14);}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.4px;color:#585C62;margin-top:8px;}
</style></head><body>
<div class="wrap">
  <div><div class="c card">shadow/card</div><div class="lab">1PX 2PX 8PX RGBA(5,11,20,.10)</div></div>
  <div><div class="c hover">shadow/hover</div><div class="lab">2PX 4PX 16PX RGBA(5,11,20,.14)</div></div>
</div>
</body></html>
