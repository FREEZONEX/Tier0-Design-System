<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);color:#050B14;}
  .wrap{padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .c{background:#fff;border:1px solid #CCC;padding:16px;height:60px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:#585C62;}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.4px;color:#ACAEB1;margin-top:6px;}
</style></head><body>
<div class="wrap">
  <div><div class="c" style="border-radius:4px">4 px</div><div class="lab">BUTTON / INPUT / TAG</div></div>
  <div><div class="c" style="border-radius:10px">10 px</div><div class="lab">CARD / POPOVER</div></div>
  <div><div class="c" style="border-radius:999px">999 px</div><div class="lab">STATUS PILL</div></div>
</div>
</body></html>
