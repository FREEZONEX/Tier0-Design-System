<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);color:#050B14;}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .sec{display:inline-block;background:#F0FBD2;color:#73B200;padding:6px 20px;font-size:18px;line-height:1;letter-spacing:-0.18px;border-radius:2px;font-weight:400;width:max-content;}
  .tag{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;font-family:var(--font-mono);font-size:12px;border-radius:4px;background:#F0FBD2;color:#73B200;}
  .pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;font-size:12px;font-weight:500;letter-spacing:-0.2px;border-radius:999px;}
  .pill.live{background:#F0FBD2;color:#73B200}
  .pill.off{background:#F2F2F2;color:#585C62}
  .dot{width:6px;height:6px;border-radius:50%;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
</style></head><body>
<div class="wrap">
  <div class="sec">Edition Comparison</div>
  <div class="row">
    <span class="tag">MQTT</span>
    <span class="tag">TimescaleDB</span>
    <span class="tag">Node-RED</span>
    <span class="pill live"><span class="dot" style="background:#73B200"></span>Live</span>
    <span class="pill off"><span class="dot" style="background:#ACAEB1"></span>Idle</span>
  </div>
</div>
</body></html>
