<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<!-- Shared demo. Product: ../tier0-product/button-primary-black.html · Website: ../company-website/buttons-cta.html -->
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  .wrap{padding:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  button{border:0;cursor:pointer;font-family:var(--font-sans);font-weight:500;font-size:16px;letter-spacing:-0.3px;padding:12px 20px;height:43px;border-radius:4px;}

  .disabled{background:#CDCED0;color:#fff;cursor:not-allowed;}

<div class="wrap">
  <button class="primary">Start free trial</button>
  <button class="brand">Get Tier0</button>
  <button class="secondary">View docs</button>
  <button class="ghost">Cancel</button>
  <button class="disabled" disabled>Disabled</button>
</div>
