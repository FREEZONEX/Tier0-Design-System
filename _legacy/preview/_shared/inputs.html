<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);color:#050B14;}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:12px;}
  input{font-family:var(--font-sans);font-size:14px;letter-spacing:-0.2px;padding:10px 14px;border:1px solid #CCC;border-radius:4px;background:#fff;color:#050B14;height:40px;outline:none;}
  input:focus{border-color:#73B200;box-shadow:0 0 0 2px rgba(178,237,29,.35)}
  .row{display:flex;gap:10px;align-items:center;}
  .chk{width:16px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;}
  .on{background:#CCF368;}
  .off{border:1px solid #CDCED0;background:#fff;}
  .ind{background:#CDCED0;color:#fff;font-size:12px;font-weight:700;}
  .lab{font-size:14px;letter-spacing:-0.2px;color:#050B14;}
  svg{display:block}
</style></head><body>
<div class="wrap">
  <div class="row"><input placeholder="factory/workshop/CNC" style="flex:1"></div>
  <div class="row"><input placeholder="Focused" style="flex:1;border-color:#73B200;box-shadow:0 0 0 2px rgba(178,237,29,.35)"></div>
  <div class="row" style="gap:18px">
    <span class="row" style="gap:8px"><span class="chk on"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5L4.2 7L8 3" stroke="#050B14" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span><span class="lab">Enabled</span></span>
    <span class="row" style="gap:8px"><span class="chk off"></span><span class="lab">Off</span></span>
    <span class="row" style="gap:8px"><span class="chk ind">–</span><span class="lab">Indeterminate</span></span>
  </div>
</div>
</body></html>
