<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  .wrap{padding:20px;display:flex;gap:10px;align-items:stretch;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border-radius:8px;min-height:110px;}
  .sw .name{font-family:var(--font-mono);font-size:12px;letter-spacing:-0.3px;}
  .sw .hex{font-family:var(--font-mono);font-size:13px;font-weight:500;}
  .dark{color:#fff}.light{color:#050B14}
</style></head><body>
<div class="wrap">
  <div class="sw dark" style="background:#050B14"><div class="name">fx-black</div><div class="hex">#050B14</div></div>
  <div class="sw light" style="background:#B2ED1D"><div class="name">fx-lime ★</div><div class="hex">#B2ED1D</div></div>
  <div class="sw dark" style="background:#73B200"><div class="name">fx-deep-green</div><div class="hex">#73B200</div></div>
  <div class="sw light" style="background:#CCF368"><div class="name">button-lime</div><div class="hex">#CCF368</div></div>
  <div class="sw light" style="background:#F0FBD2;border:1px solid #E2EFBA"><div class="name">green-1</div><div class="hex">#F0FBD2</div></div>
</div>
</body></html>
