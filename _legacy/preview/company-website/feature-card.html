<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="../../tokens/website.css">
<style>
  html,body{margin:0;padding:24px;background:var(--page);font-family:var(--font-body);}

  .card{max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px;}

  .card p{margin:10px 0 0;font-size:15px;line-height:1.65;color:var(--text-3);}

<body>
<p class="tag">company-website · feature card</p>
