<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/product.css">
<style>
  html,body{margin:0;font-family:var(--font-sans);}
  .tag{position:absolute;top:8px;right:8px;font-size:10px;color:#585c62;text-transform:uppercase;letter-spacing:.04em;}
  .sidebar{width:220px;min-height:280px;background:var(--fx-black);color:#fff;padding:20px 8px 12px;position:relative;box-sizing:border-box;}
  .logo{font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--fx-lime);letter-spacing:-0.02em;margin:0 12px 16px;}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:2px 0;border-radius:4px;font-size:14px;letter-spacing:-0.2px;cursor:pointer;color:#cdcfd0;}
  .item svg{flex-shrink:0;opacity:.85;}
  .item.active{color:var(--fx-lime);background:rgba(178,237,29,.08);}
  .item:hover:not(.active){background:rgba(255,255,255,.04);}
</style>
</head>
<body>
<aside class="sidebar">
  <span class="tag">tier0-product</span>
  <p class="logo">Tier0</p>
  <div class="item active">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
    <span>Namespace</span>
  </div>
  <div class="item">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/></svg>
    <span>Broker</span>
  </div>
  <div class="item">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M8 3v10"/></svg>
    <span>Source Flow</span>
  </div>
  <div class="item">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5"/></svg>
    <span>Topology</span>
  </div>
</aside>
</body>
</html>
