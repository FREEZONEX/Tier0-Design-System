const SRC = {

  dropdown: 'packages/ui/components/ui/dropdown-menu.tsx',
  sonner: 'packages/ui/components/ui/sonner.tsx',
  chart: 'packages/ui/components/ui/chart.tsx',
  plan: 'apps/saas-dashboard/app/ws/[workspaceId]/(pages)/settings/components/workspace/plan/',
};
const P = SRC.plan;

// button.tsx → buttonVariants（cva）
const BTN_BASE = "inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none cursor-pointer [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px]";
const BTN_VARIANT = {
  default: 'bg-button-highlight text-highlight-foreground hover:bg-button-highlight-hover',
  primary: 'bg-button-primary text-white shadow-xs hover:bg-button-primary-hover',
  destructive: 'bg-button-destructive text-white shadow-xs hover:bg-button-destructive-hover focus-visible:ring-destructive/20',
  outline: 'border bg-background shadow-xs hover:bg-bg-tertiary hover:text-text dark:bg-input/30 dark:border-input dark:hover:bg-input/50',
  secondary: 'bg-bg-accent text-text shadow-xs hover:bg-bg-tertiary',
  ghost: 'hover:bg-bg-tertiary hover:text-text',
  link: 'text-text underline-offset-4 hover:underline',
};
const BTN_SIZE = { sm: 'h-8 rounded-md gap-1.5 px-4', md: 'h-9 rounded-md px-4 py-2', lg: 'h-10 rounded-md px-4', icon: 'size-9' };

// billing-date.tsx → TOOLTIP_CONTENT_CLASS
const TOOLTIP_CONTENT_CLASS = 'bg-button-primary text-primary-foreground rounded-[2px] px-2 py-1.5 text-sm leading-[22px] font-normal whitespace-nowrap shadow-[0px_2px_8px_0px_rgba(0,0,0,0.15)]';

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ic = (name, cls = '') => `<i data-lucide="${name}" class="${cls}"></i>`;
const fmt = (n) => Number(n).toLocaleString('en-US');
const money = (n) => (n < 0 ? '- $' : '$') + fmt(Math.abs(n));
const meta = (component, src, props = '') =>
  `data-component="${esc(component)}" data-src="${esc(src)}"${props ? ` data-props="${esc(props)}"` : ''}`;

function Button({ variant = 'default', size = 'sm', label = '', icon = '', iconRight = '', action = '', arg = '', disabled = false, loading = false, cls = '', id = '', name = 'Button' }) {
  const lead = loading ? ic('loader', 'animate-spin ' + (size === 'sm' ? 'size-4' : 'size-5')) : icon ? ic(icon) : '';
  // 模拟 cn()（tailwind-merge）：className 带 px-* 时替换尺寸里的默认 px-4
  const sizeCls = /(^|\s)px-/.test(cls) ? BTN_SIZE[size].replace(/\bpx-\d+\b/, '') : BTN_SIZE[size];

function SegmentedProgress(used, total, color) {
  if (total > 10) return CnProgress(Math.round((used / Math.max(total, 1)) * 100), color || undefined);
  let segs = '';
  for (let i = 0; i < total; i++) segs += `<span class="h-2 flex-1 rounded-[2px] ${i < used ? color || 'bg-primary' : 'bg-bg-accent'}"></span>`;

}

const dayMs = 86400000;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const sameDay = (a, b) => a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const daysBetween = (a, b) => Math.round((b - a) / dayMs);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = (d) => `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const fmtShort = (d) => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
const fmtSlash = (d) => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;

// 每日用量：按日期确定性生成，同一天在任何时间范围下数值一致
function hash(n) { let x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
function rawDay(d) {
  if (d < WS_CREATED || d > TODAY) return [0, 0, 0];
  const k = Math.floor(d / dayMs);
  const wd = d.getDay();
  const base = (wd === 0 || wd === 6 ? 0.35 : 1) * (0.55 + hash(k) * 0.9);
  return [base * (0.56 + hash(k + 1) * 0.06), base * (0.24 + hash(k + 2) * 0.05), base * (0.14 + hash(k + 3) * 0.05)];
}
let SCALE = 1;
function calibrate(target) {
  let sum = 0;
  for (let d = new Date(CYCLE_START); d <= TODAY; d = addDays(d, 1)) sum += rawDay(d).reduce((a, b) => a + b, 0);
  SCALE = sum ? target / sum : 0;
}
const dayUsage = (d) => rawDay(d).map((v) => v * SCALE);
function sumRange(from, to) {
  const m = [0, 0, 0];
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) dayUsage(d).forEach((v, i) => (m[i] += v));
  return m.map(Math.round);
}

function renderCreditsCard(cr) {
  const owner = isOwner();
  const pct = cr.total ? Math.round((cr.used / cr.total) * 1000) / 10 : 0;
  const modSum = cr.modules.reduce((a, b) => a + b, 0) || 1;
  // 模块颜色按用量顺序只排一组；套餐额度用完后，同一组颜色跨过间隔继续排进附加额度
  let planLeft = Math.min(cr.used, cr.plan);
  const slices = MODULES.map((m, i) => {
    const planPart = Math.min(cr.modules[i], planLeft);
    planLeft -= planPart;
    return { plan: planPart, extra: cr.modules[i] - planPart, bar: m.bar };
  });
  const track = (parts, cap, extraClass, style) => `<div class="flex h-full overflow-hidden rounded-full bg-bg-accent ${extraClass}" ${style}>${parts.map((n, i) => `<span class="h-full" style="width:${cap ? (n / cap) * 100 : 0}%;background:${slices[i].bar}"></span>`).join('')}</div>`;
  const planStyle = cr.purchased && cr.total ? `style="width:${(cr.plan / cr.total) * 100}%"` : 'style="width:100%"';
  const bar = `<div class="flex h-2 ${cr.purchased ? 'gap-1' : ''}" role="meter" aria-valuenow="${cr.used}" aria-valuemax="${cr.total}" ${meta('CreditsStackedBar（新增）', P + 'ai-credits-card.tsx', '模块颜色一组往前排；套餐额度与附加额度中间留间隔')}>
      ${track(slices.map((s) => s.plan), cr.plan, '', planStyle)}
      ${cr.purchased ? track(slices.map((s) => s.extra), cr.purchased, 'min-w-0 flex-1', '') : ''}
    </div>`;
  // 模块明细：行高 24、行距 4；名称 14 Regular text-secondary，数值 14 Medium，占比 14 灰
  const rowR = (count, p) => `<span class="flex items-center gap-2 tabular"><span class="font-medium">${count}</span><span class="w-9 text-right text-text-tertiary">${p}%</span></span>`;
  const list = cr.used === 0
    ? `<div class="flex h-6 items-center justify-between text-sm/6"><span class="text-text-secondary">No usage yet</span>${rowR(0, 0)}</div>`
    : MODULES.map((m, i) => `<div class="flex h-6 items-center justify-between text-sm/6"><span class="flex items-center gap-2 text-text-secondary"><span class="size-2 rounded-[2px] ${m.dot}"></span>${m.name}</span>${rowR(fmt(cr.modules[i]), Math.round((cr.modules[i] / modSum) * 100))}</div>`).join('');
  return `<section class="border-border flex flex-col gap-5 rounded-md border p-4" ${meta('AICreditsCard', P + 'ai-credits-card.tsx')}>
    ${cardHead('coins', 'AI Credits', `<span class="flex gap-1.5 truncate text-xs/[14px] text-text-tertiary">Reset on:<span class="tabular">${fmtDate(RESET)}</span></span>`,
      `<button type="button" data-action="tab" data-arg="usage" class="inline-flex shrink-0 items-center gap-1 text-sm/6 text-text-tertiary hover:text-text">View usage${ic('arrow-up-right', 'size-4')}</button>`)}
    <div class="flex flex-wrap items-center justify-between gap-3">
      ${bigNumber(fmt(cr.used), fmt(cr.total), pct)}
      ${owner ? Button({ label: 'Buy Credits', action: 'openDialog', arg: 'buyCredits', cls: 'px-3' }) : ''}
    </div>
    <div class="flex flex-col gap-2">${bar}
      <div class="flex items-center justify-between">${barLabel('Plan', `${fmt(cr.usedPlan)} / ${fmt(cr.plan)}`, HelpTip('Includes credits from your plan and seats', 'size-3'))}${cr.purchased ? barLabel('Purchased', `${fmt(cr.usedPurchased)} / ${fmt(cr.purchased)}`) : ''}</div>
    </div>
    <div class="flex flex-col gap-2">${dashed}<div class="flex flex-col gap-1">${list}</div></div>

/* ---------- Usage tab ---------- */
const RANGES = { '1h': 'Last hour', '24h': 'Last 24 hours', '7d': 'Last 7 days', '30d': 'Last 30 days', custom: 'Custom range' };
function rangeDates() {
  if (S.range === 'custom' && S.custom) return [S.custom.from, S.custom.to];
  const days = { '1h': 0, '24h': 0, '7d': 6, '30d': 29 }[S.range];
  return [addDays(TODAY, -days), TODAY];
}
function buildSeries() {
  const [from, to] = rangeDates();
  if (S.range === '1h' || S.range === '24h') {
    const n = S.range === '1h' ? 12 : 24;
    const today = dayUsage(TODAY);
    return Array.from({ length: n }, (_, i) => {
      const w = (0.4 + hash(i + 7) * 1.2) / n;
      const label = S.range === '1h' ? `${String(10).padStart(2, '0')}:${String(i * 5).padStart(2, '0')}` : `${String(i).padStart(2, '0')}:00`;
      return { label, tip: S.range === '1h' ? `Oct 27, ${label}` : `Oct 27, ${label}`, v: today.map((x) => x * w * (S.range === '1h' ? 0.08 : 1)) };
    });
  }
  const span = daysBetween(from, to) + 1;
  if (span > 62) {
    const out = [];
    for (let d = new Date(from.getFullYear(), from.getMonth(), 1); d <= to; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      const a = d < from ? from : d, end = new Date(d.getFullYear(), d.getMonth() + 1, 0), b = end > to ? to : end;
      out.push({ label: MONTHS[d.getMonth()], tip: `${MONTHS[d.getMonth()]} ${d.getFullYear()}`, v: sumRange(a, b) });
    }
    return out;
  }
  return Array.from({ length: span }, (_, i) => { const d = addDays(from, i); return { label: fmtShort(d), tip: fmtDate(d), v: dayUsage(d) }; });
}

function renderUsageTab() {

  const days = Math.max(1, daysBetween(from, to) + 1);

  const prevSpan = daysBetween(CYCLE_START, TODAY);
  const prevStart = new Date(2026, 8, 8);
  const prev = sumRange(prevStart, addDays(prevStart, prevSpan)).reduce((a, b) => a + b, 0);
  const delta = prev ? Math.round(((cr.used - prev) / prev) * 100) : 0;

    ['Remaining', fmt(cr.total - cr.used), `of ${fmt(cr.plan)} plan${cr.purchased ? ` + ${fmt(cr.purchased)} add-on` : ''}`],
    ['Daily average', fmt(avg), S.range === '1h' || S.range === '24h' ? 'today' : `${RANGES[S.range].replace('Last', 'last').replace('Custom range', `${days} days`)}`],
    ['Resets in', `${resetIn} days`, `<span class="text-warning-strong">Resets ${fmtShort(RESET)}</span>`],

    <div class="flex flex-wrap items-center gap-3">
      <div class="relative">

        <span>${S.range === '1h' || S.range === '24h' ? fmtSlash(TODAY) : `${fmtSlash(from)} – ${fmtSlash(to)}`}</span>
        ${Button({ variant: 'ghost', size: 'icon', icon: 'chevron-right', action: 'shift', arg: '1', cls: 'size-7', disabled: to >= TODAY })}
      </div>
    </div>

    <div class="border-border grid grid-cols-2 overflow-hidden rounded-md border lg:grid-cols-4" ${meta('UsageStatTiles（新增）', P + 'usage-content.tsx')}>
      ${tiles.map(([l, v, sub], i) => `<div class="flex flex-col gap-1 border-border p-4 ${i % 2 ? '' : 'border-r'} ${i < 2 ? 'border-b lg:border-b-0' : ''} ${i === 1 ? 'lg:border-r' : ''}">
        <span class="text-xs text-text-tertiary">${l}</span><span class="text-2xl font-medium tabular">${v}</span><span class="text-xs text-text-tertiary">${sub}</span></div>`).join('')}
    </div>

      <div class="flex items-center justify-between gap-3">
        <h3 class="text-base font-medium">AI Credits Usage</h3>
        ${Button({ variant: 'outline', label: 'Export CSV', icon: 'file-down', action: 'exportCsv', disabled: emptyRange })}
      </div>
      ${emptyRange ? emptyState(noUsageAtAll ? 'No AI credit usage yet' : 'No usage in this period',
        noUsageAtAll ? 'Usage will show up here once your team starts using AI features.' : 'Try another date range.',

        : `<div id="chart" class="relative h-[260px] w-full" data-points='${esc(JSON.stringify(series))}'></div>
           <div class="flex flex-wrap gap-4 text-xs text-text-tertiary">${MODULES.map((m) => `<span class="flex items-center gap-1.5"><span class="size-2 rounded-[2px] ${m.dot}"></span>${m.name}</span>`).join('')}</div>`}
    </section>

function emptyState(title, desc, action = '', h = '') {

}

function renderBreakdown(series, empty, noUsageAtAll) {
  const totals = [0, 0, 0];
  series.forEach((s) => s.v.forEach((v, i) => (totals[i] += v)));
  const sum = totals.reduce((a, b) => a + b, 0) || 1;
  const th = 'text-foreground h-10 px-4 text-left align-middle font-medium whitespace-nowrap text-text-tertiary';
  const td = 'px-4 py-2.5 align-middle whitespace-nowrap';
  const shareCell = (p, color) => `<td class="${td}"><div class="flex items-center gap-3"><div class="h-1 w-28 overflow-hidden rounded-full bg-bg-accent"><div class="h-full rounded-full" style="width:${p}%;background:${color}"></div></div><span class="w-9 text-text-tertiary tabular">${p}%</span></div></td>`;
  let head, rows;
  if (S.breakdown === 'module') {
    head = ['Module', 'Credits', 'Share', 'vs last cycle'];
    rows = MODULES.map((m, i) => {
      const p = Math.round((totals[i] / sum) * 100);
      const ch = [10, 14, 21][i];
      return `<tr class="border-b border-border"><td class="${td}"><span class="flex items-center gap-2"><span class="size-2 rounded-[2px] ${m.dot}"></span>${m.name}</span></td><td class="${td} tabular">${fmt(Math.round(totals[i]))}</td>${shareCell(p, m.bar)}<td class="${td} text-destructive tabular">+${ch}%</td></tr>`;
    }).join('');
  } else {
    head = ['User', 'Credits', 'Share', 'Last active'];
    rows = USERS.map((u) => `<tr class="border-b border-border"><td class="${td}"><span class="flex items-center gap-2"><span class="flex size-5 items-center justify-center rounded-full text-[10px] font-medium ${u.c}">${u.name[0]}</span>${u.name}${u.you ? '<span class="text-text-tertiary">(You)</span>' : ''}</span></td>
      <td class="${td} tabular">${fmt(Math.round(sum * u.share))}</td>${shareCell(Math.round(u.share * 100), 'var(--primary)')}<td class="${td} text-text-tertiary">${u.last}</td></tr>`).join('');
  }
  const segBtn = (k, l) => `<button type="button" role="tab" data-action="breakdown" data-arg="${k}" data-state="${S.breakdown === k ? 'active' : 'inactive'}" class="h-6 cursor-pointer rounded-sm px-3 text-xs font-medium whitespace-nowrap text-text-tertiary hover:bg-bg-tertiary data-[state=active]:bg-background data-[state=active]:text-text data-[state=active]:shadow-xs">${l}</button>`;
  return `<section class="border-border space-y-4 rounded-md border p-4" ${meta('Breakdown 明细', P + 'usage-content.tsx')}>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h3 class="text-base font-medium">Breakdown</h3>
      <div role="tablist" class="inline-flex h-8 items-center rounded-md border border-border bg-bg-accent p-1" ${meta('CnTabs', SRC.tabs, 'type="card"（tabBarClassName 覆盖为文字分段）')}>${segBtn('module', 'By module')}${segBtn('user', 'By user')}</div>
    </div>
    <div class="overflow-x-auto rounded-md border border-border" ${meta('Table', SRC.table)}>
      <table data-slot="table" class="w-full caption-bottom text-sm">
        <thead class="[&_tr]:border-b bg-bg-subtle"><tr class="border-b border-border">${head.map((h) => `<th class="${th}">${h}</th>`).join('')}</tr></thead>
        <tbody class="[&_tr:last-child]:border-0">${empty ? `<tr><td colspan="4">${emptyState(noUsageAtAll ? 'No usage to break down' : 'No usage in this period', noUsageAtAll ? `Credits used by each ${S.breakdown === 'module' ? 'module' : 'member'} will be listed here.` : 'Nothing was used between these dates.')}</td></tr>` : rows}</tbody>
      </table>
    </div>
  </section>`;
}

function renderRangeMenu() {

    <button type="button" role="menuitem" data-action="menu" data-arg="custom" class="${item}">Custom range${ic('chevron-right', 'size-4')}</button>

function renderCustomPicker() {
  const p = S.picker || (S.picker = { month: new Date(2026, 8, 1), from: S.custom?.from || null, to: S.custom?.to || null });
  const cal = (m, side) => {
    const first = new Date(m.getFullYear(), m.getMonth(), 1), daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < first.getDay(); i++) cells += '<span></span>';
    for (let d = 1; d <= daysIn; d++) {
      const dt = new Date(m.getFullYear(), m.getMonth(), d);
      const future = dt > TODAY;
      const sel = sameDay(dt, p.from) || sameDay(dt, p.to);
      const inR = p.from && p.to && dt > p.from && dt < p.to;
      cells += `<button type="button" ${future ? 'disabled' : `data-action="pickDay" data-arg="${dt.getTime()}"`} class="h-8 text-sm tabular ${sel ? 'rounded-sm bg-button-highlight font-medium text-highlight-foreground' : inR ? 'bg-highlight-bg-tertiary' : 'rounded-sm hover:bg-bg-tertiary'} ${future ? 'cursor-not-allowed text-text-placeholder' : ''}">${d}</button>`;
    }
    const nav = (dir, dis) => `<button type="button" ${dis ? 'disabled' : `data-action="pickMonth" data-arg="${dir}"`} aria-label="${dir < 0 ? 'Previous month' : 'Next month'}" class="flex size-5 items-center justify-center rounded-sm text-text-tertiary hover:text-text disabled:opacity-30">${ic(dir < 0 ? 'chevron-left' : 'chevron-right', 'size-3.5')}</button>`;
    const nextDisabled = side === 'right' && m.getFullYear() === TODAY.getFullYear() && m.getMonth() === TODAY.getMonth();
    return `<div class="min-w-0 flex-1">
      <div class="mb-1 flex h-6 items-center justify-between">${side === 'left' ? nav(-1) : '<span class="size-5"></span>'}<span class="text-sm font-medium">${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][m.getMonth()]} ${m.getFullYear()}</span>${side === 'right' ? nav(1, nextDisabled) : '<span class="size-5"></span>'}</div>
      <div class="grid grid-cols-7 gap-y-0.5 text-center">${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((w) => `<span class="py-1 text-xs text-text-tertiary">${w}</span>`).join('')}${cells}</div></div>`;
  };
  const m2 = new Date(p.month.getFullYear(), p.month.getMonth() + 1, 1);
  // Figma 18001:133253：宽 512，内边距 16，区块间距 16
  return `<div class="absolute top-full left-0 z-50 mt-1 flex w-[512px] max-w-[calc(100vw-32px)] flex-col gap-4 rounded-md border border-border bg-popover p-4 text-popover-foreground shadow-md" ${meta('Ant Design RangePicker（样式覆盖）', 'antd DatePicker.RangePicker · 规范：日期选择优先 AntD')}>
    <div class="flex items-center justify-between gap-2"><span class="text-sm font-medium">Custom range</span><span class="text-xs text-text-tertiary">Full days included · UTC+08:00</span></div>
    <div class="flex min-w-0 flex-col gap-4 sm:flex-row">${cal(p.month, 'left')}${cal(m2, 'right')}</div>
    <div class="flex items-center justify-between gap-2">
      ${Button({ variant: 'outline', size: 'md', label: 'Reset', action: 'pickReset' })}
      <div class="flex gap-2">${Button({ variant: 'outline', size: 'md', label: 'Cancel', action: 'menu', arg: '' })}${Button({ size: 'md', label: 'Apply', action: 'pickApply', disabled: !(p.from && p.to) })}</div>
    </div>
  </div>`;
}

function drawChart() {
  const el = document.getElementById('chart');
  if (!el) return;
  // Tailwind 浏览器版异步生成样式，容器尺寸可能晚于首次绘制，用 ResizeObserver 跟随重绘
  if (!el._ro && window.ResizeObserver) {
    el._ro = new ResizeObserver(() => { if (el.clientWidth !== el._w || el.clientHeight !== el._h) drawChart(); });
    el._ro.observe(el);
  }
  el._w = el.clientWidth; el._h = el.clientHeight;
  const pts = JSON.parse(el.dataset.points);
  const W = el.clientWidth || 600, H = Math.max(el.clientHeight, 200), padL = 40, padB = 26, padT = 8;
  const totals = pts.map((p) => p.v.reduce((a, b) => a + b, 0));
  const maxV = Math.max(...totals, 1);
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find((s) => maxV / s <= 4) || 1000;
  const top = Math.ceil(maxV / step) * step;
  const y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const bw = (W - padL) / pts.length;
  const week = pts.length === 7 && S.range !== '1h' && S.range !== '24h';
  const barW = week ? Math.min(82, Math.max(2, bw - 16)) : Math.max(2, Math.min(28, bw * 0.62));
  let g = '';
  for (let t = 0; t <= top; t += step) g += `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-width="1"/><text x="${padL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted-foreground)">${fmt(t)}</text>`;
  const every = Math.ceil(pts.length / 7);
  let bars = '';
  pts.forEach((p, i) => {
    const x = padL + i * bw + (bw - barW) / 2;
    let acc = 0;
    p.v.forEach((v, k) => {
      const h = y(acc) - y(acc + v);
      if (h > 0) bars += `<rect x="${x}" y="${y(acc + v)}" width="${barW}" height="${h}" fill="${MODULES[k].bar}" shape-rendering="crispEdges"/>`;
      acc += v;
    });
    bars += `<rect data-i="${i}" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padT - padB}" fill="transparent" class="hit"/>`;
    const last = i === pts.length - 1;
    if ((i % every === 0 && pts.length - 1 - i >= every / 2) || last) bars += `<text x="${last ? W : x + barW / 2}" y="${H - 6}" text-anchor="${last ? 'end' : 'middle'}" font-size="11" fill="var(--muted-foreground)">${p.label}</text>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="AI credits usage by day">${g}${bars}</svg><div id="chart-tip" hidden class="pointer-events-none absolute z-10 w-48 rounded-md border border-border bg-popover p-2.5 text-xs text-popover-foreground shadow-md"></div>`;
  const tip = el.querySelector('#chart-tip');
  el.querySelectorAll('.hit').forEach((r) => {
    r.addEventListener('mouseenter', () => {
      const p = pts[+r.dataset.i];
      const tot = p.v.reduce((a, b) => a + b, 0);
      tip.innerHTML = `<div class="mb-1.5 flex justify-between font-medium"><span>${p.tip}</span><span>Total ${fmt(Math.round(tot))}</span></div>` +
        MODULES.map((m, k) => `<div class="flex justify-between py-0.5"><span class="flex items-center gap-1.5 text-text-tertiary"><span class="size-2 rounded-[2px] ${m.dot}"></span>${m.name}</span><span class="font-medium tabular">${fmt(Math.round(p.v[k] * 10) / 10)}</span></div>`).join('');
      tip.hidden = false;
      const bx = +r.getAttribute('x') + bw / 2;
      tip.style.left = (bx > W / 2 ? Math.max(0, bx - 204) : Math.min(bx + 12, W - 196)) + 'px';
      tip.style.top = '12px';
      r.setAttribute('fill', 'color-mix(in oklab, var(--foreground) 5%, transparent)');
    });
    r.addEventListener('mouseleave', () => { tip.hidden = true; r.setAttribute('fill', 'transparent'); });
  });
}

function CnDialog({ title, description = '', body = '', footer = '', className = '', src, closable = true, name = 'CnDialog' }) {
  // 仓库里 cn() = tailwind-merge：className 传入宽度/间距时会替换 DialogContent 默认的 w-full / gap-8 / sm:max-w-2xl
  const has = (re) => re.test(className);
  const merged = [has(/(^|\s)w-/) ? '' : 'w-full', has(/(^|\s)gap-/) ? '' : 'gap-8', has(/sm:max-w-/) ? '' : 'sm:max-w-2xl'].join(' ');
  return `<div class="fixed inset-0 z-50 bg-black/50" data-action="closeDialog" data-overlay></div>
  <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" ${meta(name, src, `className="${className}"`)}
    class="bg-background text-foreground fixed top-[50%] left-[50%] z-50 grid max-w-[calc(100%-2rem)] translate-x-[-50%] translate-y-[-50%] overflow-y-auto rounded-md border p-8 shadow-lg [&>*]:min-w-0 max-h-[calc(100vh-2rem)] ${merged} ${className}">
    <div data-slot="dialog-header" class="flex flex-col gap-4 text-left">
      <h2 id="dlg-title" data-slot="dialog-title" class="text-dialog-title h-8 text-2xl/8 font-semibold max-w-[90%] truncate">${title}</h2>
      ${description ? `<div data-slot="dialog-description" class="text-muted-foreground text-sm">${description}</div>` : ''}
    </div>
    ${body}
    ${footer}
    ${closable ? `<button type="button" data-action="closeDialog" data-slot="dialog-close" class="absolute top-8 right-8 cursor-pointer rounded-xs opacity-70 transition-opacity hover:opacity-100 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-6">${ic('x')}<span class="sr-only">Close</span></button>` : ''}
  </div>`;
}
const footerRow = (...btns) => `<div data-slot="dialog-footer" class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end shrink-0">${btns.join('')}</div>`;

function SeatStepper(value, min, max, key) {
  const ghostIcon = (icon, delta, dis, cls) => `<button type="button" data-action="step" data-key="${key}" data-arg="${delta}" ${dis ? 'disabled' : ''} aria-label="${delta > 0 ? 'increase' : 'decrease'}" class="${BTN_BASE} ${BTN_VARIANT.ghost} ${BTN_SIZE.icon} ${cls}">${ic(icon, 'size-4')}</button>`;
  return `<div class="border-border inline-flex items-center rounded-md border" ${meta('SeatStepper', P + 'seats-dialog/seat-stepper.tsx', `value={${value}} min={${min}} max={${max}}`)}>

    ${ghostIcon('plus', 1, value >= max, 'rounded-l-none')}</div>`;
}

function toast(type, msg) {
  const icons = { success: ['circle-check', 'text-success'], error: ['octagon-x', 'text-destructive'], info: ['info', 'text-blue-color'] };
  const el = document.createElement('div');
  el.setAttribute('role', 'status');
  el.dataset.component = `toast.${type}() · sonner`;
  el.dataset.src = SRC.sonner;
  el.className = 'pointer-events-auto flex w-[356px] max-w-full items-center gap-2 rounded-md border border-border bg-popover px-4 py-3 text-sm text-popover-foreground shadow-lg transition-all duration-300 translate-y-[-8px] opacity-0';
  el.innerHTML = `${ic(icons[type][0], 'size-4 shrink-0 ' + icons[type][1])}<span>${msg}</span>`;
  document.getElementById('toast-root').appendChild(el);
  window.lucide && lucide.createIcons();
  requestAnimationFrame(() => el.classList.remove('translate-y-[-8px]', 'opacity-0'));
  setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, 3600);
}

/* =========================================================================
 * 9. 渲染与事件
 * ========================================================================= */
function render() {
  renderBar();
  document.getElementById('page').innerHTML = renderPage();
  renderDialog();
  renderDrawer();
  document.body.classList.toggle('inspect', S.inspect);
  if (window.lucide) lucide.createIcons();
  drawChart();
  try { localStorage.setItem('t0-proto', JSON.stringify({ tab: S.tab, role: S.role, scenario: S.scenario })); } catch (e) { /* 存储不可用时忽略 */ }
}

function openDialog(k) {
  S.menu = null;
  const s = S.data.seats;
  S.dlg = {};
  if (k === 'removeSeats') {
    if (Math.min(s.purchased, seatTotal() - s.used) <= 0) { S.dialog = isOwner() ? 'seatsInUse' : 'seatsInUseMember'; return render(); }
    S.dlg = { count: 1 };
  }
  if (k.startsWith('addSeats')) {
    S.dlg = { count: 1 };
    if (k === 'addSeatsPromo') S.dlg = { count: 2, promoOpen: true, promoText: 'DISCOUNT50', promoApplied: 'DISCOUNT50' };
    if (k === 'addSeatsInvalid') S.dlg = { count: 2, promoOpen: true, promoText: 'SUMMER', promoInvalid: true };
    if (k === 'addSeatsError') S.dlg = { count: 1, previewError: true };
    if (k === 'addSeatsRestored') S.dlg = { count: 2, restored: true };
    k = 'addSeats';
  }
  if (k === 'confirmPay') S.dlg = { count: 2 };
  if (k === 'buyCredits') S.dlg = { pack: 0 };
  S.dialog = k;
  render();
}
const closeDialog = () => { S.dialog = null; S.dlg = {}; render(); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const actions = {
  proto(el) {
    const k = el.dataset.key, v = el.dataset.arg;
    if (k === 'scenario') loadScenario(v);
    else if (k === 'role') S.role = v;
    else if (k === 'pendingRemoval') S.pendingRemoval = +v;
    else S[k] = v === 'true';
    S.menu = null;
    render();
  },
  tab(el) { S.tab = el.dataset.arg; S.menu = null; render(); document.getElementById('main').scrollTop = 0; },
  menu(el) { const m = el.dataset.arg; S.menu = S.menu === m || !m ? null : m; if (m === 'custom') S.picker = null; render(); },
  range(el) { S.range = el.dataset.arg; S.menu = null; render(); },
  shift(el) {
    const [from, to] = rangeDates();
    const span = daysBetween(from, to) + 1, dir = +el.dataset.arg;
    let nf = addDays(from, dir * span), nt = addDays(to, dir * span);
    if (nt >= TODAY) {
      nt = TODAY; nf = addDays(TODAY, -(span - 1));
      const preset = { 7: '7d', 30: '30d' }[span];
      if (preset) { S.range = preset; return render(); }
    }
    S.custom = { from: nf, to: nt }; S.range = 'custom';
    render();
  },
  pickMonth(el) { const p = S.picker; p.month = new Date(p.month.getFullYear(), p.month.getMonth() + +el.dataset.arg, 1); render(); },
  pickDay(el) {
    const d = new Date(+el.dataset.arg), p = S.picker;
    if (!p.from || p.to) { p.from = d; p.to = null; } else if (d < p.from) { p.to = p.from; p.from = d; } else p.to = d;
    render();
  },
  pickReset() { S.picker.from = S.picker.to = null; render(); },
  pickApply() { S.custom = { from: S.picker.from, to: S.picker.to }; S.range = 'custom'; S.menu = null; render(); },
  breakdown(el) { S.breakdown = el.dataset.arg; render(); },
  exportCsv() { toast('success', 'Export started. The CSV will download shortly.'); },
  openDialog(el) { openDialog(el.dataset.arg); },
  closeDialog,
  step(el) {
    const d = S.dlg, delta = +el.dataset.arg;
    const s = S.data.seats;
    const max = el.dataset.key === 'remove' ? Math.min(s.purchased, seatTotal() - s.used) : 99;
    d.count = Math.max(1, Math.min(max, d.count + delta));
    render();
  },
  togglePromo() { S.dlg.promoOpen = !S.dlg.promoOpen; render(); setTimeout(() => document.getElementById('promo-input')?.focus()); },
  async retryPreview() { S.dlg.retrying = true; render(); await wait(800); S.dlg.retrying = false; S.dlg.previewError = false; render(); },
  toConfirmPay() { const keep = S.dlg; S.dialog = 'confirmPay'; S.dlg = { count: keep.count, promoApplied: keep.promoApplied }; render(); },
  async pay() {
    S.dlg.paying = true; render(); await wait(1000);
    S.data.seats.purchased += S.dlg.count;
    closeDialog(); toast('success', 'Seats added');
  },
  async removeConfirm() {
    S.dlg.loading = true; render(); await wait(800);
    S.pendingRemoval = S.dlg.count; closeDialog(); toast('success', 'Seat removal scheduled');
  },
  cancelRemoval() { S.pendingRemoval = 0; render(); toast('success', 'Seat removal cancelled'); },
  addCard() {
    S.dialog = null; render();
    toast('info', 'Redirecting to Stripe to add a card…');
    setTimeout(() => { S.hasCard = true; toast('success', "Your card has been added successfully. We'll take you back to add seats."); openDialog('addSeatsRestored'); }, 1400);
  },
  goMembers() { closeDialog(); toast('info', '跳转 Members 页（/ws/[workspaceId]/settings?activeTab=members）'); },
  pack(el) { S.dlg.pack = +el.dataset.arg; render(); },
  async purchase() { S.dlg.loading = true; render(); await wait(800); closeDialog(); toast('info', 'Redirecting to Stripe Checkout…'); },
  async cancelConfirm() {
    S.dlg.loading = true; render(); await wait(800);
    S.canceled = true; closeDialog(); toast('success', `Subscription canceled — ends ${fmtDate(RESET)}`);
  },
  async undoCancel() { S.dlg.undoLoading = true; render(); await wait(800); S.dlg = {}; S.canceled = false; render(); toast('success', 'Your plan will renew as usual'); },
  portal() { toast('info', 'Opening Stripe Customer Portal…'); },
  upgrade() { toast('info', '打开 Upgrade Plan 弹窗（useUpgradePlanDialog，既有）'); },
  toastDemo() { S.menu = null; render(); toast('success', 'Seats added'); setTimeout(() => toast('error', 'Failed to add seats, please retry'), 500); },
  inspect() { S.inspect = !S.inspect; render(); },
  panel() { S.panelOpen = !S.panelOpen; S.menu = null; render(); },
  drawer() { S.drawer = !S.drawer; S.menu = null; render(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (S.menu && !e.target.closest('[role="menu"], [data-component^="Ant Design RangePicker"]')) { S.menu = null; render(); }
    return;
  }
  if (el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.dialog) closeDialog(); else if (S.menu) { S.menu = null; render(); } else if (S.drawer) { S.drawer = false; render(); }
  }
  if (e.key === 'Enter' && e.target.id === 'promo-input') applyPromo(e.target.value);
});
document.addEventListener('focusout', (e) => { if (e.target.id === 'promo-input' && e.target.value.trim() && e.target.value.trim().toUpperCase() !== S.dlg.promoApplied) applyPromo(e.target.value); });
function applyPromo(v) {
  const code = v.trim().toUpperCase();
  S.dlg.promoText = code;
  S.dlg.promoApplied = PROMOS[code] ? code : null;
  S.dlg.promoInvalid = !!code && !PROMOS[code];
  render();
}

// 标注模式悬停提示
const tipEl = document.getElementById('inspect-tip');
document.addEventListener('mousemove', (e) => {
  if (!S.inspect) { tipEl.hidden = true; return; }
  const t = e.target.closest('[data-component]');
  if (!t) { tipEl.hidden = true; return; }
  tipEl.innerHTML = `<div class="rounded-md border border-blue-accent bg-popover px-3 py-2 text-xs text-popover-foreground shadow-lg">
    <p class="font-semibold text-blue-color">${esc(t.dataset.component)}</p>
    ${t.dataset.props ? `<p class="font-code mt-0.5 text-[11px] text-text-secondary">${esc(t.dataset.props)}</p>` : ''}
    <p class="font-code mt-1 text-[11px] break-all text-text-tertiary">${esc(t.dataset.src || '')}</p></div>`;
  tipEl.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - 436), y = Math.min(e.clientY + 16, window.innerHeight - 90);
  tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = y + 'px';
});

// 暗色：仓库用 .dark 类（@custom-variant dark），这里按 viewer 主题同步
function syncDark() {
  const dt = document.documentElement.getAttribute('data-theme');
  const dark = dt === 'dark' || (!dt && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}
syncDark();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncDark);
new MutationObserver(syncDark).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawChart, 120); });

try {
  const saved = JSON.parse(localStorage.getItem('t0-proto') || 'null');
  if (saved) { S.role = saved.role || 'owner'; loadScenario(saved.scenario || 'active'); S.tab = saved.tab || 'plan'; }
} catch (e) { /* 忽略 */ }
renderShell();
render();
})();
</script>
