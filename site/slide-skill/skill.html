<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="icon" href="../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKILL.md · Tier0 Slide Skill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css?v=20260804l">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="page">
    <nav class="site-nav" aria-label="Primary">
      <a class="site-nav__brand" href="../"><img src="../assets/brand/tier0-logo-black.svg" alt="Tier0"><span>Slide Skill</span></a>
      <div class="site-nav__links">
        <a class="site-nav__cta" href="https://github.com/FREEZONEX/Tier0-Design-System" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </nav>
    <main class="shell">
      <header class="page-hero-lite">
        <div class="eyebrow">Agent contract</div>
        <h1>SKILL.md</h1>
        <p>Agent 完整工作流原文。</p>
      </header>
      <section class="section">
        <div class="chip-row" style="margin-bottom:20px">
          <a class="chip" href="./SKILL.md" target="_blank" rel="noopener"><b>Raw SKILL.md →</b></a>
          <a class="chip" href="./README.md" target="_blank" rel="noopener"><b>README.md →</b></a>
        </div>
        <article class="md-body" id="md">加载中…</article>
      </section>
    </main>
    <footer class="site-footer"><span>SKILL.md</span><span><a href="./demo.html">Demo</a></span></footer>
  </div>
  <script>
    (async () => {
      const urls = ['./SKILL.txt', './SKILL.md'];
      let text = null;
      let lastErr = null;
      for (const url of urls) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) throw new Error(String(r.status));
          text = await r.text();
          break;
        } catch (err) {
          lastErr = err;
        }
      }
      if (text == null) throw lastErr || new Error('fetch failed');
      document.getElementById('md').innerHTML = marked.parse(text.replace(/^---[\s\S]*?---\s*/, ''));
    })().catch(err => {
      document.getElementById('md').innerHTML = '<p>无法加载：' + err.message + '</p>';
    });
  </script>
</body>
</html>
