/* 连接阶段直接沿用参考 index.html 的样式。AI 色值由本次需求指定。 */
.story-side {
  --ai-cyan: #67e8f9;
  --ai-green: #b2ed1d;
  padding: 54px 0 70px;
  min-height: 100svh;
  position: relative;
}
.legacy-ambient {
  position: absolute;
  inset: 0;
  transition: opacity 1.2s;
}
.story-side:not([data-segment='0']) .legacy-ambient {
  opacity: 0.12;
}
.story-composition {
  width: 100%;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.scene-box {
  position: relative;
  width: min(92%, 760px);
  aspect-ratio: 800/625;
  flex-shrink: 0;
}
.scene-canvas {
  width: 800px;
  height: 625px;
  position: absolute;
  top: 0;
  left: 0;
  transform: scale(var(--scene-scale, 1));
  transform-origin: top left;
}
.legacy-scene {
  position: absolute;
  inset: 0;
}
.legacy-scene .network {
  width: 800px;
  height: 625px;
}
.story-side:not([data-segment='0']) .legacy-scene {
  pointer-events: none;
}
.story-side:not([data-segment='0']) .node-callout {
  display: none;
}
.legacy-scene .core-accent {
  transform-box: view-box;
  transform-origin: 400px 262px;
}
.legacy-scene .core-plate {
  transform-box: view-box;
  transform-origin: 400px 284px;
}
.story-side [data-motion='legacy-core'] {
  transform-origin: 0 0;
}
.story-steps {
  display: flex;
  gap: 31px;
  justify-content: center;
  margin-top: 22px;
}
.story-steps button {
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  color: var(--tier0-text-tertiary);
  font-size: 11px;
  white-space: nowrap;
}
.story-steps button[aria-pressed='true'] {
  color: var(--tier0-text-secondary);
}
.story-steps small {
  font:
    9px ui-monospace,
    SFMono-Regular,
    monospace;
  opacity: 0.8;
}
.story-side .motion-tools {
  z-index: 8;
}
.story-side .settings {
  z-index: 9;
}
.standalone {
  border-left: 0;
}
.standalone .scene-box {
  width: min(92%, 980px, calc((100svh - 145px) * 1.28));
}
.uns-panel,
.prompt-panel,
.context-chip,
.results-layout {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.story-side[data-segment='1'] .uns-panel {
  pointer-events: auto;
}
.story-side[data-segment='2'] .prompt-panel,
.story-side[data-segment='2'] .results-layout {
  pointer-events: auto;
}
.uns-panel {
  left: 75px;
  top: 50px;
  width: 650px;
  height: 390px;
  background: var(--tier0-bg-color);
  border: 1px solid
    color-mix(in srgb, var(--tier0-highlight-deep) 42%, var(--tier0-border));
  border-radius: 7px;
  box-shadow:
    8px 9px 0 #e4efd2,
    0 16px 34px #121a0a12;
  transform-origin: 50% 50%;
  z-index: 6;
  overflow: hidden;
  will-change: transform, opacity;
}
.uns-header {
  height: 49px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  background: color-mix(
    in srgb,
    var(--tier0-highlight) 18%,
    var(--tier0-bg-color)
  );
  border-bottom: 1px solid
    color-mix(in srgb, var(--tier0-highlight-deep) 24%, var(--tier0-border));
}
.uns-header strong {
  font-weight: 500;
  font-size: 18px;
  letter-spacing: -0.025em;
}
.namespace-chip {
  font:
    9px ui-monospace,
    SFMono-Regular,
    monospace;
  color: var(--tier0-highlight-deep);
  background: color-mix(
    in srgb,
    var(--tier0-highlight) 15%,
    var(--tier0-bg-color)
  );
  padding: 3px 5px;
  border-radius: 3px;
}
.uns-status {
  margin-left: auto;
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 10px;
  color: var(--tier0-text-tertiary);
}
.uns-status i,
.uns-footer i,
.context-chip i,
.app-card header i,
.state-normal i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--tier0-highlight-deep);
  display: inline-block;
}
.uns-breadcrumb {
  height: 34px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  font:
    9px ui-monospace,
    SFMono-Regular,
    monospace;
  color: var(--tier0-text-tertiary);
  border-bottom: 1px solid var(--tier0-border);
}
.uns-breadcrumb span {
  color: var(--tier0-text-secondary);
}
.uns-body {
  height: 275px;
  display: grid;
  grid-template-columns: 214px 1fr;
}
.uns-tree {
  border-right: 1px solid var(--tier0-border);
  padding: 12px 9px;
  position: relative;
  background: color-mix(
    in srgb,
    var(--tier0-bg-tertiary) 70%,
    var(--tier0-bg-color)
  );
}
.tree-entry {
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  white-space: nowrap;
  height: 33px;
  padding: 0 7px;
  width: 100%;
  text-align: left;
  border-radius: 4px;
}
.tree-entry svg {
  flex-shrink: 0;
  color: var(--tier0-text-tertiary);
}
.tree-entry.root-entry {
  font-weight: 500;
  font-size: 14px;
}
.line-entry {
  padding-left: 21px;
}
.machine-entry {
  padding-left: 33px;
  gap: 6px;
  font-size: 12px;
}
.tree-entry.chosen {
  background: color-mix(
    in srgb,
    var(--tier0-highlight) 12%,
    var(--tier0-bg-color)
  );
}
.tree-entry.chosen svg {
  color: var(--tier0-highlight-deep);
}
.tree-children {
  position: relative;
  padding-left: 52px;
  margin-top: 4px;
}
.tree-children:before {
  content: '';
  position: absolute;
  left: 43px;
  top: -6px;
  bottom: 16px;
  border-left: 1px solid var(--tier0-border);
}
.type-entry {
  font-size: 12px;
  position: relative;
  gap: 8px;
}
.type-entry:before {
  content: '';
  position: absolute;
  left: -9px;
  top: 16px;
  width: 9px;
  border-top: 1px solid var(--tier0-border);
}
.type-entry small {
  margin-left: auto;
  font:
    9px ui-monospace,
    SFMono-Regular,
    monospace;
  color: var(--tier0-text-tertiary);
}
.tree-root-path {
  padding: 13px 0 0 39px;
  font:
    8px/1.65 ui-monospace,
    SFMono-Regular,
    monospace;
  color: var(--tier0-text-tertiary);
}
.signals-table {
  padding: 0 17px;
}
.signals-head {
  height: 29px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: var(--tier0-text-tertiary);
}
.signals-head small {
  font:
    8px ui-monospace,
    SFMono-Regular,
    monospace;
  letter-spacing: 0.06em;
}
.signal-row {
  height: 40px;
  border-top: 1px solid var(--tier0-border);
  display: flex;
  align-items: center;
  gap: 9px;
  will-change: opacity, transform;
}
.signal-marker {
  width: 4px;
  height: 4px;
  border-radius: 1px;
  background: var(--tier0-blue-color);
  flex-shrink: 0;
}
.signal-row.state .signal-marker {
  background: var(--tier0-text-tertiary);
}
.signal-row.action .signal-marker {
  background: var(--tier0-highlight-deep);
}
.signal-description {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.signal-description strong {
  font-size: 12px;
  font-weight: 400;
}
.signal-description small {
  font:
    8px ui-monospace,
    SFMono-Regular,
    monospace;
  color: var(--tier0-text-tertiary);
}
.signal-value {
  margin-left: auto;
  font:
    14px ui-monospace,
    SFMono-Regular,
    monospace;
  white-space: nowrap;
  color: var(--tier0-text-color);
}
.signal-value small {
  font-size: 10px;
  color: var(--tier0-text-tertiary);
  margin-left: 5px;
}
.signal-row.state .signal-value,
.signal-row.action .signal-value {
  font-size: 10px;
  letter-spacing: 0.025em;
}
.signal-row.action .signal-value {
  color: var(--tier0-highlight-deep);
  background: color-mix(
    in srgb,
    var(--tier0-highlight) 12%,
    var(--tier0-bg-color)
  );
  padding: 4px 6px;
  border-radius: 3px;
}
.uns-footer {
  height: 31px;
  border-top: 1px solid var(--tier0-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 19px;
  color: var(--tier0-text-tertiary);
  font:
    8px ui-monospace,
    SFMono-Regular,
    monospace;
}
.uns-footer > span:first-child {
  display: flex;
  align-items: center;
  gap: 6px;

/* 舞台高度 = 54 上留白 + 场景 + 25 间距 + 32 导航 + 70 下留白；按完整高度反推宽度，消除首屏 36px 溢出与右下工具被裁切。 */
.standalone .scene-box {

  stroke-width: 7;
  stroke-opacity: 0.3;
}

  content: "";
  position: absolute;
  left: calc(0.65em + 3px);
  right: 0;
  bottom: 0;
  height: 1.5px;
  border-radius: 1px;
  pointer-events: none;
}
.story-steps button::before {
  background: var(--tier0-border);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.step-progress {
  display: block;
  background: var(--tier0-highlight-deep);
  transform: scaleX(0);
  transform-origin: left center;
  transition: opacity 0.3s ease;
}
.story-steps button[aria-pressed="true"]::before {
  opacity: 1;
}
.story-steps button:not([aria-pressed="true"]) .step-progress {
  opacity: 0;
}
.story-still .story-steps button::before,
.story-still .step-progress {
  display: none;
}

/* 工具按钮与卡片悬停反馈统一收敛到 200ms 内。 */
.motion-tools button {
  transition:
    background 0.18s ease,
    color 0.18s ease;
}
.result-card {
  transition:
    border-color 0.18s ease,
    box-shadow 0.2s ease;
}

/* 未选中的数据源卡片：保持卡面不透明，只淡化文字与图标，避免下方连线端点透出。 */
.legacy-scene .node.muted {
  opacity: 1;
}
.legacy-scene .node text {
  transition: fill 0.25s ease;
}
.legacy-scene .node .node-icon {
  transition: color 0.25s ease;
}
.legacy-scene .node.muted text {
  fill: color-mix(in srgb, var(--tier0-text-tertiary) 70%, var(--tier0-bg-color));
}
.legacy-scene .node.muted .node-icon {
  color: color-mix(in srgb, var(--tier0-highlight-deep) 38%, var(--tier0-bg-color));
}
.legacy-scene .node.muted .node-dot {
  fill: var(--tier0-border);
}
.login-page .story-side:not(.standalone) .scene-box{width:min(92%,760px,calc((100svh - 190px) * 1.28))}
