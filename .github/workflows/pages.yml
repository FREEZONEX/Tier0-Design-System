name: Deploy design system site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '00-foundation/**'
      - '01-tokens/**'
      - '03-brand/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site with tokens and brand assets
        run: |
          mkdir -p _pages
          cp -R site 00-foundation 01-tokens 03-brand _pages/
          cat > _pages/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=./site/">
            <link rel="canonical" href="./site/">
            <title>Tier0 Design System</title>
          </head>
          <body><p><a href="./site/">Open Tier0 Design System</a></p></body>
          </html>
          HTML
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
