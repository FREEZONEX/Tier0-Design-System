name: Deploy public site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/tier0-slide-skill/**'
      - 'tokens/**'
      - 'scripts/build-public-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: skills/tier0-slide-skill/package-lock.json
      - name: Install slide-skill deps
        run: npm ci
        working-directory: skills/tier0-slide-skill
      - name: Build public site
        run: node scripts/build-public-site.mjs
      - name: Stage Pages artifact under /site
        run: |
          mkdir -p _pages/site
          cp -R site/. _pages/site/
          cat > _pages/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <link rel="icon" href="./site/assets/brand/favicon.png" type="image/png">
            <meta http-equiv="refresh" content="0;url=./site/">
            <link rel="canonical" href="./site/">
            <title>Tier0 Design System</title>
          </head>
          <body>
            <p><a href="./site/">Open Tier0 Design System site</a></p>
          </body>
          </html>
          EOF
          touch _pages/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
