<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/deck.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#333;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
  .frame{background:#eee;padding:16px;border-radius:8px;}
  .slide{width:960px;height:540px;background:var(--ppt-bg1);padding:48px 56px;font-family:var(--font-body-latin);}
  .tag{font-size:10px;color:#99a1aa;text-transform:uppercase;margin-bottom:20px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .tier0-card-icon .card-title{font-weight:500;font-size:18px;}
  .tier0-card-icon .card-copy{font-size:14px;}
</style>
</head>
<body>
<div class="frame">
  <div class="slide">
    <p class="tag">marketing-deck · card with icon</p>
    <div class="row">
      <article class="tier0-card-icon">
        <div class="tier0-icon-box"><i data-lucide="cable" aria-hidden="true"></i></div>
        <h3 class="card-title">Source Flow</h3>
        <p class="card-copy">Connect shop-floor sources at the edge.</p>
      </article>
      <article class="tier0-card-icon">
        <div class="tier0-icon-box"><i data-lucide="layers" aria-hidden="true"></i></div>
        <h3 class="card-title">Namespace</h3>
        <p class="card-copy">Publish a semantic MQTT topic tree.</p>
      </article>
      <article class="tier0-card-icon">
        <div class="tier0-icon-box"><i data-lucide="git-branch" aria-hidden="true"></i></div>
        <h3 class="card-title">Event Flow</h3>
        <p class="card-copy">Orchestrate flows on the namespace.</p>
      </article>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>lucide.createIcons());</script>
</body>
</html>
