<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/deck.css">
<style>
  html,body{margin:0;padding:24px;background:#f5f5f5;font-family:system-ui,sans-serif;}
  .tag{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;max-width:900px;}
  .swatch{width:100px;border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.08);background:#fff;}
  .chip{height:56px;}
  .meta{padding:8px;font-size:10px;color:#333;}
  .meta strong{display:block;font-size:11px;margin-bottom:2px;}
</style>
</head>
<body>
<p class="tag">marketing-deck · theme colors</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--ppt-tx1)"></div><div class="meta"><strong>tx1</strong>#050B14</div></div>
  <div class="swatch"><div class="chip" style="background:var(--ppt-emphasis-on-dark)"></div><div class="meta"><strong>dark · 重点标题</strong>#B2ED1D</div></div>
  <div class="swatch"><div class="chip" style="background:var(--ppt-emphasis-on-light)"></div><div class="meta"><strong>light · 重点标题</strong>#73B200</div></div>
  <div class="swatch"><div class="chip" style="background:var(--ppt-accent4)"></div><div class="meta"><strong>accent4</strong>#1D77FE</div></div>
  <div class="swatch"><div class="chip" style="background:var(--ppt-lt2)"></div><div class="meta"><strong>lt2</strong>#EFECE0</div></div>
  <div class="swatch"><div class="chip" style="background:var(--ppt-bg1);border-bottom:1px solid #eee"></div><div class="meta"><strong>bg1</strong>#FFFFFF</div></div>
</div>
</body>
</html>
