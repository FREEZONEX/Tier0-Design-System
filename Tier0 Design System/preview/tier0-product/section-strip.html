<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/product.css">
<style>
  html,body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
  .tag{font-size:10px;color:var(--tier0-text-tertiary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px;}
  .strip{display:inline-block;background:var(--fx-green-1);color:var(--fx-deep-green);font-size:18px;font-weight:400;letter-spacing:-0.18px;padding:6px 20px;border-radius:2px;text-transform:capitalize;}
  .panel{margin-top:16px;padding:16px;border:1px solid var(--tier0-border);border-radius:4px;max-width:400px;font-size:14px;color:var(--tier0-text-secondary);letter-spacing:-0.2px;}
</style>
</head>
<body>
<p class="tag">tier0-product · section strip</p>
<span class="strip">Live payload</span>
<div class="panel">JSON payload and sparkline appear below this label in the product UI.</div>
</body>
</html>
