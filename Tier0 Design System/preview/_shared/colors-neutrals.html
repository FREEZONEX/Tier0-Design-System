<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens/core.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);}
  .wrap{padding:20px;display:flex;gap:10px;align-items:stretch;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border-radius:8px;min-height:110px;}
  .sw .name{font-family:var(--font-mono);font-size:12px;letter-spacing:-0.3px;}
  .sw .hex{font-family:var(--font-mono);font-size:13px;font-weight:500;}
  .dark{color:#fff}.light{color:#050B14}
</style></head><body>
<div class="wrap">
  <div class="sw dark" style="background:#050B14"><div class="name">black-0</div><div class="hex">#050B14</div></div>
  <div class="sw dark" style="background:#585C62"><div class="name">black-4</div><div class="hex">#585C62</div></div>
  <div class="sw light" style="background:#ACAEB1"><div class="name">black-2</div><div class="hex">#ACAEB1</div></div>
  <div class="sw light" style="background:#CDCED0"><div class="name">black-1</div><div class="hex">#CDCED0</div></div>
  <div class="sw light" style="background:#CCCCCC"><div class="name">border</div><div class="hex">#CCCCCC</div></div>
  <div class="sw light" style="background:#FFFFFF;border:1px solid #CCC"><div class="name">surface</div><div class="hex">#FFFFFF</div></div>
</div>
</body></html>
